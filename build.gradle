plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'io.github.lambig'
version = '1.3.2'

repositories { mavenCentral() }

dependencies {
    api 'io.github.lambig:Tuplite:1.0.1'
    compileOnly 'org.projectlombok:lombok:1.18.42'
    annotationProcessor 'org.projectlombok:lombok:1.18.42'
    testCompileOnly 'org.projectlombok:lombok:1.18.42'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.42'
    testImplementation 'io.github.lambig:functional-interface-extension:1.1.3'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.23.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withSourcesJar()
    withJavadocJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 11
    options.encoding = 'UTF-8'
}
tasks.withType(Javadoc).configureEach { options.encoding = 'UTF-8' }
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    if (providers.environmentVariable('TEST_JAVA_HOME').isPresent()) {
        executable = providers.environmentVariable('TEST_JAVA_HOME').get() + '/bin/java'
    }
}
tasks.withType(Jar).configureEach { from('LICENSE') { into 'META-INF' } }

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            pom {
                name = 'Patterns'
                description = 'Ordered conditional functions and consumers for Java 11.'
                url = 'https://github.com/lambig/Patterns'
                licenses {
                    license {
                        name = 'MIT License'
                        url = 'https://opensource.org/licenses/MIT'
                    }
                }
                developers { developer { id = 'lambig'; name = 'Lambig' } }
                scm {
                    connection = 'scm:git:https://github.com/lambig/Patterns.git'
                    developerConnection = 'scm:git:ssh://git@github.com/lambig/Patterns.git'
                    url = 'https://github.com/lambig/Patterns'
                }
            }
        }
    }
    repositories {
        maven {
            name = 'Candidate'
            url = layout.buildDirectory.dir('repository')
        }
    }
}

// 署名鍵は公開用bundleの生成時だけ環境から受け取る。
def releaseBundle = providers.gradleProperty('releaseBundle').isPresent()
signing {
    required = releaseBundle
    if (releaseBundle) {
        if (providers.environmentVariable('SIGNING_KEY').isPresent()) {
            useInMemoryPgpKeys(providers.environmentVariable('SIGNING_KEY').get(),
                    providers.environmentVariable('SIGNING_PASSWORD').orNull)
        }
        sign publishing.publications.mavenJava
    }
}

tasks.register('centralBundle', Zip) {
    dependsOn 'publishMavenJavaPublicationToCandidateRepository'
    archiveFileName = "${project.name}-${project.version}-central.zip"
    destinationDirectory = layout.buildDirectory.dir('central')
    from(layout.buildDirectory.dir('repository')) {
        include "io/github/lambig/${project.name}/${project.version}/*.jar*"
        include "io/github/lambig/${project.name}/${project.version}/*.pom*"
        include "io/github/lambig/${project.name}/${project.version}/*.module*"
    }
    doFirst {
        if (!releaseBundle) throw new GradleException('centralBundle requires -PreleaseBundle and signing credentials')
        ['.jar', '-sources.jar', '-javadoc.jar', '.pom', '.module'].each { suffix ->
            def signature = layout.buildDirectory.file("repository/io/github/lambig/${project.name}/${project.version}/${project.name}-${project.version}${suffix}.asc").get().asFile
            if (!signature.isFile()) throw new GradleException("Missing signature: ${signature.name}")
        }
    }
}
